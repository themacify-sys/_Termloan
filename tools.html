<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Tools & Calculators | Term Loan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/style.css">
</head>
<body class="bg-[#0B0C10] text-[#C5C6C7]">
    <nav class="glass-panel border-b border-gray-800 py-4 px-6 flex justify-between">
        <a href="index.html" class="text-2xl font-bold text-white font-heading">Term <span class="text-[#66FCF1]">Loan</span></a>
        <div class="space-x-6 text-sm">
            <a href="index.html">Home</a>
            <a href="tools.html" class="text-[#66FCF1]">Calculators</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>

    <section class="py-16 max-w-4xl mx-auto px-4">
        <h1 class="text-3xl font-bold text-white font-heading mb-8 text-center">Business Financial Capacity Calculator</h1>

        <div class="glass-panel p-8 rounded-2xl grid md:grid-cols-2 gap-8" id="eligibility-calc-form">
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold mb-2 text-gray-300">Monthly Net Revenue / Income (₹)</label>
                    <input type="number" id="monthly-income" value="150000" class="w-full bg-[#1F2833] border border-gray-700 rounded p-3 text-white focus:outline-none focus:border-[#66FCF1]">
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-2 text-gray-300">Existing Monthly EMIs (₹)</label>
                    <input type="number" id="existing-emi" value="20000" class="w-full bg-[#1F2833] border border-gray-700 rounded p-3 text-white focus:outline-none focus:border-[#66FCF1]">
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-2 text-gray-300">Preferred Tenure (Years)</label>
                    <select id="loan-tenure" class="w-full bg-[#1F2833] border border-gray-700 rounded p-3 text-white focus:outline-none focus:border-[#66FCF1]">
                        <option value="1">1 Year</option>
                        <option value="3" selected>3 Years</option>
                        <option value="5">5 Years</option>
                    </select>
                </div>
            </div>

            <div class="bg-[#1F2833] p-6 rounded-xl flex flex-col justify-center text-center space-y-6" id="calc-result">
                <div>
                    <div class="text-xs text-gray-400">Available Monthly Borrowing Capacity</div>
                    <div class="text-2xl font-bold text-[#66FCF1] mt-1" id="display-emi-capacity">₹ 55,000</div>
                </div>
                <div class="border-t border-gray-700 pt-4">
                    <div class="text-xs text-gray-400">Estimated Loan Eligibility Limit</div>
                    <div class="text-3xl font-bold text-white font-heading mt-1" id="display-max-loan">₹ 14,85,000</div>
                </div>
                <a href="contact.html" class="btn-primary py-2.5 rounded text-xs">Apply Based On Result</a>
            </div>
        </div>
    </section>

    <script src="assets/app.js"></script>
</body>
</html>
